[project]
name = "lab07-first-principles"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
src = [".", "tests"]
# bikes_data.py is given by the lab and must stay unchanged
extend-exclude = ["bikes_data.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]